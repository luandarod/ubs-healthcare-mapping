name: UBS migration tests
on:
  push:
    branches: [test-ubs-migration]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install pytest -r projects/ubs-healthcare-mapping/requirements.txt
      - name: Python tests
        run: python -m pytest -q projects/ubs-healthcare-mapping/tests
      - name: Audit published outputs
        if: always()
        run: python projects/ubs-healthcare-mapping/scripts/audit_telemedicine_outputs.py
